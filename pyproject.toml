[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openguardrails-bench"
version = "0.1.0"
description = "OpenGuardrailsBench: reproducible safety, security and policy guardrail evaluation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.6", "transformers>=4.53,<6", "accelerate>=1", "huggingface_hub>=0.34", "sentencepiece", "protobuf"]
quant = ["bitsandbytes>=0.46"]
hub = ["huggingface_hub>=0.34"]
test = ["pytest>=8"]

[project.scripts]
ogb = "ogb.cli:main"

[tool.setuptools.packages.find]
include = ["ogb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
